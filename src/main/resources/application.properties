spring.application.name=expense-approval-system
server.port=${PORT:8084}
spring.datasource.url=jdbc:mysql://localhost:3306/expense_approval_system_db
spring.datasource.username=root
spring.datasource.password=siva@4590

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.com.siva.expense_approval_system.application.impl=DEBUG
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-secure-value}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
logging.level.org.springframework.security=DEBUG

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
